<!DOCTYPE html>
<html>
<head>
    <title>Create Certificate</title>
    <link rel="stylesheet" href="/static/css/create_certificate.css">
</head>

<body>

    <h1>Create Certificate</h1>

    <div class="certificate-container">

        <h2>Student Certificate</h2>

        <div class="search-section">
            <input type="text" id="adm_no" placeholder="Enter Admission No">
            <button id="searchbtn">Search</button>
        </div>

        <div class="student-info">

            <label>Student Name</label>
            <input type="text" id="student_name" readonly>

            <label>Father Name</label>
            <input type="text" id="father_name" readonly>

            <label>Date of Birth</label>
            <input type="text" id="dob" readonly>

            <label>Admission Date</label>
            <input type="text" id="doj" readonly>

        </div>

        <button id="generatebtn">Generate Certificate</button>

    </div>

</body>
</html>
