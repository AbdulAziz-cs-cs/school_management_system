<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Certificate — Student Verification</title>
    <link rel="stylesheet" href="/static/css/create_certificate.css">
</head>
<body>

    <div class="form-container">
        <h2>Student Certificate Verification</h2>
        <p class="subtitle">Search student by admission number to auto-fill details.</p>

        <div class="search-box">
            <input type="text" id="adm_no" placeholder="Enter Admission No">
            <button id="searchbtn" type="button">Search</button>
        </div>

        <form class="student-form" onsubmit="return false;">
            <div class="form-group">
                <label for="student_name">Student Name</label>
                <input type="text" id="student_name" readonly placeholder="Auto-filled name">
            </div>

            <div class="form-group">
                <label for="father_name">Father Name</label>
                <input type="text" id="father_name" readonly placeholder="Auto-filled father name">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="text" id="dob" readonly placeholder="DD-MM-YYYY">
            </div>

            <div class="form-group">
                <label for="doj">Admission Date</label>
                <input type="text" id="doj" readonly placeholder="DD-MM-YYYY">
            </div>

            <div class="action-footer">
                <button id="nextBtn" class="btn-primary" type="button">
                    Next: View Certificate &rarr;
                </button>
            </div>
        </form>
    </div>

    <script src="/static/js/create_certificate.js"></script>
</body>
</html>
