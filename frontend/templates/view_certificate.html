<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Shingrai — Certificate Preview</title>
    <link rel="stylesheet" href="/static/css/view_certificate.css">
    
    <!-- html2canvas for high-res save -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-nav" data-html2canvas-ignore="true">
        <div class="school-title">GPS Shingrai</div>
        <a href="/" id="backHomeBtn" class="btn-home">Home</a>
    </header>

    <!-- Certificate Container -->
    <main class="cert-area">
        <div class="certificate-wrapper" id="certificateCard">
            <!-- Background Image -->
            <img src="/static/assets/images/Certificate.jpg" alt="Certificate" class="cert-background">

            <!-- Precise Overlay Fields -->
            <div class="cert-field cert-name" id="certName">---</div>
            <div class="cert-field cert-father" id="certFather">---</div>
            <div class="cert-field cert-doj" id="certDoj">---</div>
            <div class="cert-field cert-adm-no" id="certAdmNo">---</div>
            <div class="cert-field cert-date" id="certIssueDate">--/--/----</div>
        </div>
    </main>

    <!-- Bottom Action Controls -->
    <footer class="action-controls" data-html2canvas-ignore="true">
        <a href="/certificate" class="btn-back">&larr; Back to Search</a>
        <button id="savebtn" class="btn-save" type="button">Save to Gallery</button>
    </footer>

    <script src="/static/js/view_certificate.js"></script>
</body>
</html>
