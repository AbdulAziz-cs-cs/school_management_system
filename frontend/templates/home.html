<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> i i i</title>
    
    <!-- AUTH CHECK: Blocks unauthenticated users before page renders -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "/";
        }
    </script>

    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>

    <div class="layout">
        <main class="main">
            <h1> i i i</h1>
            <hr class="line1">

            <div class="dashboard">
                <button class="menu-item" id="stdrecords" type="button">
                    Students Records
                </button>

                <button class="menu-item" id="certificatecreation" type="button">
                    Create Certificate
                </button>

                <button class="menu-item" id="history" type="button">
                    Certification History
                </button>

                <button class="menu-item" id="signout" type="button">
                    Sign Out
                </button>
            </div>
        </main>
    </div>

    <script src="/static/js/home.js"></script>

    <!-- LOGOUT HANDLER -->
    <script>
        document.getElementById("signout")?.addEventListener("click", () => {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("authToken");
            window.location.href = "/";
        });
    </script>
</body>
</html>
