<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Student Records</title>

    <!-- AUTH GUARD -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "/login.html";
        }
    </script>

    <link rel="stylesheet" href="/static/css/studentrecords.css">
</head>
<body>
    
    <h1>student records</h1>

    <div class="input-row">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="father_name" placeholder="Father Name">

        <!-- GENDER SELECTOR -->
        <select id="gender" class="custom-select">
            <option value="Male" selected>Male</option>
            <option value="Female">Female</option>
        </select>

        <div class="date-input">
            <span id="dob-label">Date of Birth</span>
            <input type="date" id="dateofbirth">
        </div>

        <div class="date-input">
            <span id="doj-label">Admission Date</span>
            <input type="date" id="doj">
        </div>

        <input type="text" id="adm_no" placeholder="Admission No">
        <button id="adbtn" type="button">Add</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Serial Number</th>
                    <th>Admission No</th>
                    <th>Student name</th>
                    <th>Gender</th>
                    <th>Father name</th>
                    <th>Date of birth</th>
                    <th>Admission date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tablebody"></tbody> 
        </table>
    </div>

    <script src="/static/js/studentrecords.js"></script>
</body>
</html>
